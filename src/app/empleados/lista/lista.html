<div class="container mt-4">
    <h2 class="text-center">Lista de Empleados</h2>
    <table class="table table-dark table-striped mt-3 table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Departamento</th>
            <th>Sueldo</th>
        </tr>
        </thead>
        <tbody>
        @for (empleado of empleados(); track empleado.idEmpleado) {
            <tr>
                <td>{{ empleado.idEmpleado }}</td>
                <td>{{ empleado.nombre }}</td>
                <td>{{ empleado.departamento }}</td>
                <td>{{ empleado.sueldo | currency:'MXN':'symbol':'1.2-2'}}</td>
            </tr>
        }
        </tbody>
    </table>
</div>
