<div class="container mt-4" style="max-width: 620px;">
    <span class="page-eyebrow">Editar registro</span>
    <h2 class="page-title">Editar empleado</h2>
    <p class="page-subtitle">Actualiza los datos del expediente.</p>

    @if (cargando()) {
    <div class="alert alert-info">Cargando...</div>
    }

    @if (error() && !cargando()) {
    <div class="alert alert-danger">{{ error() }}</div>
    }

    @if (!cargando() && !error()) {
    <div class="rh-card">
        <form (ngSubmit)="onSubmit()" #f="ngForm">
            <div class="mb-3">
                <label class="form-label">ID</label>
                <input class="form-control" type="text" [value]="'#' + empleado().idEmpleado" disabled />
                <div class="form-text">El ID no se puede modificar.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre"
                    [ngModel]="empleado().nombre"
                    (ngModelChange)="empleado.update(e => ({ ...e, nombre: $event }))"
                    required minlength="2" placeholder="Nombre completo" />
            </div>

            <div class="mb-3">
                <label class="form-label">Departamento</label>
                <input type="text" class="form-control" name="departamento"
                    [ngModel]="empleado().departamento"
                    (ngModelChange)="empleado.update(e => ({ ...e, departamento: $event }))"
                    required placeholder="Ej. Ventas, TI, RH" />
            </div>

            <div class="mb-4">
                <label class="form-label">Sueldo</label>
                <input type="number" class="form-control" name="sueldo"
                    [ngModel]="empleado().sueldo"
                    (ngModelChange)="empleado.update(e => ({ ...e, sueldo: $event }))"
                    required min="0" step="0.01" placeholder="0.00" />
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit" [disabled]="f.invalid || guardando()">
                    {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
                </button>
                <a class="btn btn-outline-secondary" [routerLink]="['/empleados']">Cancelar</a>
            </div>
        </form>
    </div>
    }
</div>
